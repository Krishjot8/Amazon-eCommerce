<div class="sign-in-page">
  <img 
    class="amazon-authentication-logo" 
    src="assets/logo-images/amazon-authentication-logo.jpg" 
    routerLink=""
    alt="Amazon Logo" 
  />

  <div class="sign-in-container">
    <div class="span-signin">
      <span>Sign in or create account</span>
    </div>
    
    <div class="span-email-mobile">
      <label for="emailOrPhone">Enter mobile number or email</label>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onContinue()" class="form-sign-in" novalidate>
      <div class="input-container" [class.has-error]="submitted && errorMessage">
        <!-- Country Code Selector (Appears when phone entry detected) -->
         <div *ngIf="isPhoneInput" class="custom-select-wrapper">
        <select 
          formControlName="selectedCountry" 
          class="country-select">
          <option *ngFor="let country of countryList" [value]="country.code">
            {{ country.code }} {{ country.dialCode }}
          </option>
        </select>
          </div>
        <!-- Main Input -->
      <input 
  id="emailOrPhone"
  class="inputlogin"
  type="text" 
  autocomplete="off"
  formControlName="emailOrPhone"
/>

     <!-- Clear Button: Bind to Reactive Form value and class="btn-clear" -->
<button 
  type="button" 
  class="btn-clear" 
  *ngIf="loginForm.get('emailOrPhone')?.value" 
  (click)="clearInput()"
>
  ✕
</button>
      </div>

      <!-- Error Message Box -->
      <div class="error-message" *ngIf="errorMessage && submitted">
        <img class="error-icon" src="assets/logo-images/errors-icon.svg" alt="Error Icon" />
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Submit Button -->
      <div class="continue-sign-in">
        <button type="submit">Continue</button>
      </div>
    </form>

    <div class="sign-in-conditions-privacy">
      <p>By continuing, you agree to Amazon's <a href="">Conditions of Use</a> and <a href="">Privacy Notice</a>.</p>
    </div>

    <div class="sign-in-help">
      <span>Need Help?</span>
    </div>

    <hr>

    <div class="business-sign-in">
      <span>Buying for work?</span>
      <div class="business-sign-in-link">
        <a href="">Create a free business account</a>
      </div>
    </div>
  </div>

  <app-auth-footer></app-auth-footer>
</div>
